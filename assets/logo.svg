<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%" style="background:#090b10;border-radius:16px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090b10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkGlow" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090b10" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambience -->
  <rect width="840" height="240" rx="16" fill="#090b10" />
  <rect width="840" height="240" rx="16" fill="url(#bgGlow)" />
  <rect width="840" height="240" rx="16" fill="url(#pinkGlow)" />

  <!-- Subtle Precision Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="840" y2="40" />
    <line x1="0" y1="80" x2="840" y2="80" />
    <line x1="0" y1="120" x2="840" y2="120" />
    <line x1="0" y1="160" x2="840" y2="160" />
    <line x1="0" y1="200" x2="840" y2="200" />
    <line x1="80" y1="0" x2="80" y2="240" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="560" y1="0" x2="560" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
    <line x1="720" y1="0" x2="720" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- Left: Emblem / Shield -->
  <g transform="translate(48, 30)">
    <!-- Shield Outline Glow -->
    <polygon points="90,10 160,45 160,135 90,170 20,135 20,45" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)" opacity="0.4" />
    
    <!-- Shield Body -->
    <polygon points="90,10 160,45 160,135 90,170 20,135 20,45" fill="url(#shieldBg)" stroke="url(#primaryGrad)" stroke-width="2" />

    <!-- Orbital Telemetry Arcs -->
    <path d="M 40,30 A 75,75 0 0,1 140,30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
    <path d="M 145,145 A 75,75 0 0,1 35,145" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />

    <!-- Orbit Micro Nodes -->
    <circle cx="140" cy="30" r="3" fill="#38bdf8" />
    <circle cx="35" cy="145" r="3" fill="#f472b6" />

    <!-- Core Glyph: Stylized Inverted Anti-Gravity Lambda + Power Bolt -->
    <!-- Stylized Chevron Crown -->
    <path d="M 52,62 L 90,38 L 128,62" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Power Lightning Core -->
    <path d="M 96,48 L 74,96 L 96,96 L 82,142 L 118,84 L 96,84 Z" fill="url(#primaryGrad)" stroke="#f8fafc" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Inner Core Dot -->
    <circle cx="90" cy="90" r="2" fill="#ffffff" />
  </g>

  <!-- Right: Typography & Branding -->
  <g transform="translate(255, 62)">
    <!-- Sub-header Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="20" rx="4" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
      <text x="8" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">GOOGLE CLIENT HOOK</text>

      <rect x="143" y="0" width="70" height="20" rx="4" fill="rgba(244,114,182,0.12)" stroke="rgba(244,114,182,0.3)" stroke-width="1" />
      <text x="151" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#f472b6" letter-spacing="1">v4.0 PRO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">
      ANTIGRAVITY <tspan fill="url(#primaryGrad)">POWER TOOLS</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Cognitive Engine Switching · Zero-Yap Diffs · Live Quota Telemetry · Port Guard
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 108)">
      <!-- Pill 1: Zero-Yap -->
      <rect x="0" y="0" width="98" height="24" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="10" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">⚡ Zero-Yap</text>

      <!-- Pill 2: Safety Guard -->
      <rect x="106" y="0" width="112" height="24" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="116" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">🛡️ Safe-Guard</text>

      <!-- Pill 3: Turn Tracker -->
      <rect x="226" y="0" width="112" height="24" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="236" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">›_ Turn-Chips</text>

      <!-- Pill 4: Port Killer -->
      <rect x="346" y="0" width="104" height="24" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="356" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">🔌 Port-Killer</text>

      <!-- Pill 5: Quota Tracker -->
      <rect x="458" y="0" width="90" height="24" rx="6" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.25)" stroke-width="1" />
      <text x="468" y="16" font-family="monospace" font-size="11" fill="#38bdf8">Aggy HUD</text>
    </g>
  </g>
</svg>